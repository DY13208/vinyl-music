/genres:
  get:
    tags:
      - catalog
    operationId: listGenres
    summary: 目录分类
    security: []
    parameters:
      - $ref: ./common.yaml#/parameters/RequestId
    responses:
      "200":
        description: 目录分类
        headers:
          X-Request-Id:
            $ref: ./common.yaml#/headers/RequestId
        content:
          application/json:
            schema:
              $ref: ./models.yaml#/GenreList
      "400":
        $ref: ./common.yaml#/responses/Error
      default:
        $ref: ./common.yaml#/responses/Error
/releases:
  get:
    tags:
      - catalog
    operationId: listReleases
    summary: 查询发行版
    security: []
    parameters:
      - $ref: ./common.yaml#/parameters/RequestId
      - $ref: ./common.yaml#/parameters/Limit
      - $ref: ./common.yaml#/parameters/Cursor
      - $ref: ./common.yaml#/parameters/Q
      - $ref: ./common.yaml#/parameters/Genre
      - name: albumId
        in: query
        required: false
        schema:
          $ref: ./models.yaml#/Uuid
      - name: artistId
        in: query
        required: false
        schema:
          $ref: ./models.yaml#/Uuid
    responses:
      "200":
        description: 查询发行版
        headers:
          X-Request-Id:
            $ref: ./common.yaml#/headers/RequestId
        content:
          application/json:
            schema:
              $ref: ./models.yaml#/ReleasePage
      "400":
        $ref: ./common.yaml#/responses/Error
      default:
        $ref: ./common.yaml#/responses/Error
/albums/{albumId}:
  get:
    tags:
      - catalog
    operationId: getAlbum
    summary: 作品详情
    security: []
    parameters:
      - $ref: ./common.yaml#/parameters/RequestId
      - name: albumId
        in: path
        required: true
