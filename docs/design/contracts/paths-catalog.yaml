/editorial/issues/{issueId}:
  get:
    tags:
      - catalog
    operationId: getIssue
    summary: 策展关联唱片
    security: []
    parameters:
      - $ref: ./common.yaml#/parameters/RequestId
      - name: issueId
        in: path
        required: true
        schema:
          $ref: ./models.yaml#/Uuid
    responses:
      "200":
        description: 策展关联唱片
        headers:
          X-Request-Id:
            $ref: ./common.yaml#/headers/RequestId
        content:
          application/json:
            schema:
