/catalog/barcodes/{barcode}:
  get:
    tags:
      - catalog
    operationId: lookupBarcode
    summary: 条码匹配的发行版候选
    security: []
    parameters:
      - $ref: ./common.yaml#/parameters/RequestId
      - name: barcode
        in: path
        required: true
        schema:
          type: string
          pattern: ^(\d{12}|\d{13})$
      - $ref: ./common.yaml#/parameters/Limit
      - $ref: ./common.yaml#/parameters/Cursor
    responses:
      "200":
        description: 条码匹配的发行版候选
        headers:
          X-Request-Id:
            $ref: ./common.yaml#/headers/RequestId
        content:
          application/json:
            schema:
              $ref: ./models.yaml#/ReleasePage
      "400":
        $ref: ./common.yaml#/responses/Error
      default:
        $ref: ./common.yaml#/responses/Error
