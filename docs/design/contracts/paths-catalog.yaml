          $ref: ./models.yaml#/Uuid
    responses:
      "200":
        description: 作品详情
        headers:
          X-Request-Id:
            $ref: ./common.yaml#/headers/RequestId
        content:
          application/json:
            schema:
              $ref: ./models.yaml#/AlbumDetail
      "400":
        $ref: ./common.yaml#/responses/Error
      default:
        $ref: ./common.yaml#/responses/Error
/releases/{releaseId}:
  get:
    tags:
      - catalog
    operationId: getRelease
    summary: 发行版详情与曲目
    security: []
    parameters:
      - $ref: ./common.yaml#/parameters/RequestId
      - name: releaseId
        in: path
        required: true
        schema:
          $ref: ./models.yaml#/Uuid
    responses:
      "200":
        description: 发行版详情与曲目
        headers:
          X-Request-Id:
            $ref: ./common.yaml#/headers/RequestId
        content:
          application/json:
            schema:
              $ref: ./models.yaml#/ReleaseDetail
      "400":
        $ref: ./common.yaml#/responses/Error
      default:
        $ref: ./common.yaml#/responses/Error
/artists/{artistId}:
  get:
    tags:
      - catalog
    operationId: getArtist
    summary: 艺术家与作品
    security: []
    parameters:
      - $ref: ./common.yaml#/parameters/RequestId
      - name: artistId
        in: path
        required: true
        schema:
          $ref: ./models.yaml#/Uuid
    responses:
      "200":
        description: 艺术家与作品
        headers:
          X-Request-Id:
            $ref: ./common.yaml#/headers/RequestId
        content:
          application/json:
            schema:
              $ref: ./models.yaml#/ArtistDetail
      "400":
        $ref: ./common.yaml#/responses/Error
      default:
        $ref: ./common.yaml#/responses/Error
/search:
  get:
    tags:
      - catalog
    operationId: searchCatalog
    summary: 按类型搜索公共目录
    security: []
    parameters:
      - $ref: ./common.yaml#/parameters/RequestId
      - $ref: ./common.yaml#/parameters/Limit
      - $ref: ./common.yaml#/parameters/Cursor
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - name: type
        in: query
        required: true
        schema:
          type: string
          enum:
            - releases
            - artists
            - tracks
    responses:
      "200":
        description: 按类型搜索公共目录
        headers:
          X-Request-Id:
            $ref: ./common.yaml#/headers/RequestId
        content:
          application/json:
            schema:
              $ref: ./models.yaml#/SearchPage
      "400":
        $ref: ./common.yaml#/responses/Error
      default:
        $ref: ./common.yaml#/responses/Error
/editorial/issues:
  get:
    tags:
      - catalog
    operationId: listIssues
    summary: 已发布策展目录
    security: []
    parameters:
