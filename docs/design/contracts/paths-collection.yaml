/me/collection:
  get:
    tags:
      - library
    operationId: listCollection
    summary: 当前账号收藏
    security:
      - cookieAuth: []
    parameters:
      - $ref: ./common.yaml#/parameters/RequestId
      - $ref: ./common.yaml#/parameters/Limit
      - $ref: ./common.yaml#/parameters/Cursor
      - $ref: ./common.yaml#/parameters/Q
      - $ref: ./common.yaml#/parameters/Genre
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
            - recent
            - artist
            - year
          default: recent
      - name: releaseId
        in: query
        required: false
        schema:
          $ref: ./models.yaml#/Uuid
      - name: recordId
        in: query
        required: false
        schema:
          $ref: ./models.yaml#/Uuid
    responses:
      "200":
        description: 当前账号收藏
        headers:
          X-Request-Id:
            $ref: ./common.yaml#/headers/RequestId
        content:
          application/json:
            schema:
              $ref: ./models.yaml#/CollectionPage
      "400":
        $ref: ./common.yaml#/responses/Error
      "401":
        $ref: ./common.yaml#/responses/Error
      default:
        $ref: ./common.yaml#/responses/Error
  post:
    tags:
      - library
    operationId: addCollection
    summary: 创建收藏关系
    security:
      - cookieAuth: []
    parameters:
      - $ref: ./common.yaml#/parameters/RequestId
      - $ref: ./common.yaml#/parameters/Origin
      - $ref: ./common.yaml#/parameters/CSRF
      - $ref: ./common.yaml#/parameters/Idempotency
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./models.yaml#/CollectionInput
    responses:
      "200":
        description: 已存在，返回规范资源，不重复写入。
        headers:
          X-Request-Id:
            $ref: ./common.yaml#/headers/RequestId
          ETag:
            $ref: ./common.yaml#/headers/ETag
        content:
          application/json:
            schema:
              $ref: ./models.yaml#/CollectionEntry
      "201":
        description: 创建收藏关系
        headers:
          X-Request-Id:
            $ref: ./common.yaml#/headers/RequestId
          ETag:
            $ref: ./common.yaml#/headers/ETag
          Location:
            $ref: ./common.yaml#/headers/Location
        content:
          application/json:
            schema:
              $ref: ./models.yaml#/CollectionEntry
      "400":
        $ref: ./common.yaml#/responses/Error
      "401":
        $ref: ./common.yaml#/responses/Error
      default:
        $ref: ./common.yaml#/responses/Error
/me/collection/{entryId}:
  get:
    tags:
      - library
    operationId: getCollection
    summary: 读取收藏关系
    security:
      - cookieAuth: []
    parameters:
      - $ref: ./common.yaml#/parameters/RequestId
      - name: entryId
        in: path
        required: true
        schema:
          $ref: ./models.yaml#/Uuid
    responses:
      "200":
        description: 读取收藏关系
        headers:
          X-Request-Id:
            $ref: ./common.yaml#/headers/RequestId
          ETag:
            $ref: ./common.yaml#/headers/ETag
        content:
          application/json:
            schema:
              $ref: ./models.yaml#/CollectionEntry
      "400":
        $ref: ./common.yaml#/responses/Error
      "401":
        $ref: ./common.yaml#/responses/Error
      default:
        $ref: ./common.yaml#/responses/Error
  patch:
    tags:
      - library
    operationId: updateCollection
    summary: 更新收藏元数据
    security:
      - cookieAuth: []
    parameters:
      - $ref: ./common.yaml#/parameters/RequestId
      - name: entryId
        in: path
        required: true
        schema:
          $ref: ./models.yaml#/Uuid
      - $ref: ./common.yaml#/parameters/Origin
      - $ref: ./common.yaml#/parameters/CSRF
      - $ref: ./common.yaml#/parameters/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./models.yaml#/CollectionPatch
    responses:
      "200":
        description: 更新收藏元数据
        headers:
          X-Request-Id:
            $ref: ./common.yaml#/headers/RequestId
          ETag:
            $ref: ./common.yaml#/headers/ETag
        content:
          application/json:
            schema:
              $ref: ./models.yaml#/CollectionEntry
      "400":
        $ref: ./common.yaml#/responses/Error
      "401":
        $ref: ./common.yaml#/responses/Error
      default:
        $ref: ./common.yaml#/responses/Error
  delete:
    tags:
      - library
    operationId: removeCollection
    summary: 移除收藏关系
    security:
      - cookieAuth: []
    parameters:
      - $ref: ./common.yaml#/parameters/RequestId
      - name: entryId
        in: path
        required: true
        schema:
          $ref: ./models.yaml#/Uuid
      - $ref: ./common.yaml#/parameters/Origin
      - $ref: ./common.yaml#/parameters/CSRF
      - $ref: ./common.yaml#/parameters/IfMatch
    responses:
      "204":
        description: 操作完成，无响应体。
        headers:
          X-Request-Id:
            $ref: ./common.yaml#/headers/RequestId
      "400":
        $ref: ./common.yaml#/responses/Error
      "401":
        $ref: ./common.yaml#/responses/Error
      default:
        $ref: ./common.yaml#/responses/Error
