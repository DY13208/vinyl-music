      - name: trackId
        in: path
        required: true
        schema:
          $ref: ./models.yaml#/Uuid
      - name: providerId
        in: query
        required: true
        schema:
          $ref: ./jobs-and-media.yaml#/ProviderId
    responses:
      "200":
        description: 查询可用播放来源
        headers:
          X-Request-Id:
            $ref: ./common.yaml#/headers/RequestId
        content:
          application/json:
            schema:
              $ref: ./jobs-and-media.yaml#/PlaybackAvailability
      "400":
        $ref: ./common.yaml#/responses/Error
      default:
        $ref: ./common.yaml#/responses/Error
