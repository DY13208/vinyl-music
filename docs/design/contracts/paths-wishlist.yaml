/me/wishlist:
  get:
    tags:
      - library
    operationId: listWishlist
    summary: 当前账号愿望单
    security:
      - cookieAuth: []
    parameters:
      - $ref: ./common.yaml#/parameters/RequestId
      - $ref: ./common.yaml#/parameters/Limit
      - $ref: ./common.yaml#/parameters/Cursor
      - name: releaseId
        in: query
        required: false
        schema:
          $ref: ./models.yaml#/Uuid
    responses:
      "200":
        description: 当前账号愿望单
        headers:
          X-Request-Id:
            $ref: ./common.yaml#/headers/RequestId
        content:
          application/json:
            schema:
              $ref: ./models.yaml#/WishlistPage
      "400":
        $ref: ./common.yaml#/responses/Error
      "401":
        $ref: ./common.yaml#/responses/Error
      default:
        $ref: ./common.yaml#/responses/Error
  post:
    tags:
      - library
    operationId: addWishlist
    summary: 新增愿望
    security:
      - cookieAuth: []
    parameters:
      - $ref: ./common.yaml#/parameters/RequestId
      - $ref: ./common.yaml#/parameters/Origin
      - $ref: ./common.yaml#/parameters/CSRF
      - $ref: ./common.yaml#/parameters/Idempotency
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./models.yaml#/WishlistInput
    responses:
      "200":
        description: 已存在，返回规范资源，不重复写入。
        headers:
          X-Request-Id:
            $ref: ./common.yaml#/headers/RequestId
          ETag:
            $ref: ./common.yaml#/headers/ETag
        content:
          application/json:
            schema:
              $ref: ./models.yaml#/WishlistEntry
      "201":
        description: 新增愿望
        headers:
          X-Request-Id:
            $ref: ./common.yaml#/headers/RequestId
          ETag:
            $ref: ./common.yaml#/headers/ETag
          Location:
            $ref: ./common.yaml#/headers/Location
        content:
          application/json:
            schema:
              $ref: ./models.yaml#/WishlistEntry
      "400":
        $ref: ./common.yaml#/responses/Error
      "401":
        $ref: ./common.yaml#/responses/Error
      default:
        $ref: ./common.yaml#/responses/Error
/me/wishlist/{entryId}:
  get:
    tags:
      - library
    operationId: getWishlistEntry
    summary: 读取单个愿望
    security:
      - cookieAuth: []
    parameters:
      - $ref: ./common.yaml#/parameters/RequestId
      - name: entryId
        in: path
        required: true
        schema:
          $ref: ./models.yaml#/Uuid
    responses:
      "200":
        description: 读取单个愿望
        headers:
          X-Request-Id:
            $ref: ./common.yaml#/headers/RequestId
          ETag:
            $ref: ./common.yaml#/headers/ETag
        content:
          application/json:
            schema:
              $ref: ./models.yaml#/WishlistEntry
      "400":
        $ref: ./common.yaml#/responses/Error
      "401":
        $ref: ./common.yaml#/responses/Error
      default:
        $ref: ./common.yaml#/responses/Error
  patch:
    tags:
      - library
    operationId: updateWishlist
    summary: 更新愿望元数据
    security:
      - cookieAuth: []
    parameters:
      - $ref: ./common.yaml#/parameters/RequestId
      - name: entryId
        in: path
        required: true
        schema:
          $ref: ./models.yaml#/Uuid
      - $ref: ./common.yaml#/parameters/Origin
      - $ref: ./common.yaml#/parameters/CSRF
      - $ref: ./common.yaml#/parameters/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./models.yaml#/WishlistPatch
    responses:
      "200":
        description: 更新愿望元数据
        headers:
          X-Request-Id:
            $ref: ./common.yaml#/headers/RequestId
          ETag:
            $ref: ./common.yaml#/headers/ETag
        content:
          application/json:
            schema:
              $ref: ./models.yaml#/WishlistEntry
      "400":
        $ref: ./common.yaml#/responses/Error
      "401":
        $ref: ./common.yaml#/responses/Error
      default:
        $ref: ./common.yaml#/responses/Error
  delete:
    tags:
      - library
    operationId: removeWishlist
    summary: 移除愿望
    security:
      - cookieAuth: []
    parameters:
      - $ref: ./common.yaml#/parameters/RequestId
      - name: entryId
        in: path
        required: true
        schema:
          $ref: ./models.yaml#/Uuid
      - $ref: ./common.yaml#/parameters/Origin
      - $ref: ./common.yaml#/parameters/CSRF
      - $ref: ./common.yaml#/parameters/IfMatch
    responses:
      "204":
        description: 操作完成，无响应体。
        headers:
          X-Request-Id:
            $ref: ./common.yaml#/headers/RequestId
      "400":
        $ref: ./common.yaml#/responses/Error
      "401":
        $ref: ./common.yaml#/responses/Error
      default:
        $ref: ./common.yaml#/responses/Error
